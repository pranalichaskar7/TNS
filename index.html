<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">🎧 Music Player</div>

      <div class="search-wrap">
        <input type="text" id="search" placeholder="Search songs..." />
        <button id="voice-search" title="Voice Search">🎤</button>
      </div>

      <h3>Playlist</h3>
      <ul id="playlist" class="list">
        <li>Song 1 - Artist</li>
        <li>Song 2 - Artist</li>
        <li>Song 3 - Artist</li>
        <li>Song 4 - Artist</li>
      </ul>

      <h3>Recently Played</h3>
      <ul id="recently-played" class="list">
        <li>Yesterday Song</li>
      </ul>

      <h3>Favorites ❤</h3>
      <ul id="favorites" class="list">
        <li>Fav Song</li>
      </ul>

      <div class="counter">👀 Visitors: <span id="visits">0</span></div>
    </aside>

    <!-- Main Player -->
    <main class="player">
      <div class="now-playing">
        <img id="album-art" src="assets/images/default.jpg" alt="Album Art" />
        <div class="meta">
          <h2 id="song-title">Select a Song</h2>
          <p id="song-artist">Artist</p>
          <div class="badges">
            <span id="now-index" class="badge">0 / 0</span>
            <button id="fav-toggle" class="badge-btn" title="Toggle Favorite">♡</button>
          </div>
        </div>
      </div>

      <audio id="audio" preload="metadata"></audio>

      <div class="controls">
        <button id="prev" title="Previous">⏮</button>
        <button id="play" title="Play">▶</button>
        <button id="pause" title="Pause">⏸</button>
        <button id="next" title="Next">⏭</button>
        <button id="shuffle" title="Shuffle">🔀</button>
        <button id="repeat" title="Repeat (off → one → all)">🔁</button>
      </div>

      <div class="seekbar">
        <span id="current-time">0:00</span>
        <input type="range" id="seek" min="0" max="100" value="0" />
        <span id="duration">0:00</span>
      </div>

      <div class="volume">
        <span>🔊</span>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1" />
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
